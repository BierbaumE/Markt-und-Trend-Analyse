name = "markt-und-trend-analyse"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# Wichtig: Jede Anfrage läuft zuerst durch worker.js (Login-Prüfung),
# erst danach werden Dateien aus ./public ausgeliefert.
run_worker_first = true

# Interne Verbindung zum Backend der Familien-App (Worker "bierbaum01")
[[services]]
binding = "AUTH"
service = "bierbaum01"

[vars]
# Nur Fallback, falls die Service Binding fehlt
AUTH_BASE = "https://bierbaum01.eike-bierbaum.workers.dev"
# Optional: nur diese Benutzer zulassen (kommagetrennt, z. B. "eike,anna").
# Leer = alle freigegebenen Konten der Familien-App (außer Kind-Konten).
ALLOWED_USERS = ""
