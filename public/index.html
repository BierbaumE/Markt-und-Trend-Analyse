<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Markt- und Trend-Analyse</title>
<meta name="theme-color" content="#10161A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Radar" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<div id="app">
  <div class="topbar">
    <div>
      <h1>Markt- und Trend-Analyse</h1>
      <span class="topbar-version" id="topbarVersion"></span>
      <span class="topbar-version" id="topbarUser"></span>
    </div>
    <div class="topbar-actions">
      <button class="gear-btn" id="tasksBtn" aria-label="Aufgaben">🔔<span id="tasksBadge" class="badge-dot hidden"></span></button>
      <button class="gear-btn" id="adminBtn" aria-label="Verwaltung" style="display:none">👤</button>
      <button class="gear-btn" id="settingsBtn" aria-label="Einstellungen">⚙️</button>
    </div>
  </div>

  <div id="banners"></div>
  <div id="view"><div class="loading">Lade …</div></div>

  <div class="version-footer">
    Version <span id="appVersionLabel"></span>
    <button id="whatsNewBtn" class="link-btn">Was ist neu</button>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-btn active" data-view="cockpit"><span class="ico">🧭</span>Cockpit</button>
  <button class="nav-btn" data-view="trends"><span class="ico">📈</span>Trends</button>
  <button class="nav-btn" data-view="creators"><span class="ico">✋</span>Creator</button>
  <button class="nav-btn" data-view="companies"><span class="ico">🏪</span>Händler</button>
  <button class="nav-btn" data-view="crm"><span class="ico">🤝</span>CRM</button>
</nav>

<!-- Was ist neu (übernommen aus der Familien-App, Stand jetzt serverseitig pro Konto) -->
<div class="overlay hidden" id="whatsNewOverlay">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-head">
      <h3>Was ist neu</h3>
      <button class="icon-btn" aria-label="Schließen" onclick="document.getElementById('whatsNewOverlay').classList.add('hidden')">✕</button>
    </div>
    <div id="whatsNewContent" style="font-size:13px;line-height:1.7;color:var(--text-soft)"></div>
  </div>
</div>

<!-- Aufgaben / Wiedervorlagen -->
<div class="overlay hidden" id="tasksOverlay">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-head">
      <h3>Meine Aufgaben</h3>
      <button class="icon-btn" aria-label="Schließen" onclick="document.getElementById('tasksOverlay').classList.add('hidden')">✕</button>
    </div>
    <div id="tasksContent"></div>
  </div>
</div>

<!-- Verwaltung: Rollen, Quellen, Protokoll -->
<div class="overlay hidden" id="adminOverlay">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-head">
      <h3>Verwaltung</h3>
      <button class="icon-btn" aria-label="Schließen" onclick="document.getElementById('adminOverlay').classList.add('hidden')">✕</button>
    </div>
    <div id="adminContent"></div>
  </div>
</div>

<!-- Einstellungen -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-head">
      <h3>Einstellungen</h3>
      <button class="icon-btn" aria-label="Schließen" onclick="document.getElementById('settingsOverlay').classList.add('hidden')">✕</button>
    </div>
    <div id="settingsContent"></div>
  </div>
</div>

<!-- Detail-Sheet (Trend, Creator, Kontakt) -->
<div class="overlay hidden" id="detailOverlay">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-head">
      <h3 id="detailTitle">Details</h3>
      <button class="icon-btn" aria-label="Schließen" onclick="document.getElementById('detailOverlay').classList.add('hidden')">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
